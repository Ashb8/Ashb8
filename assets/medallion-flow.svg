<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="Medallion architecture diagram">
  <style>
    .t{font-family:ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#12352C}
    .m{font-family:ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#4A635A}
    .b{font-family:ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#fff;font-weight:700}
  </style>
  <rect width="920" height="280" rx="18" fill="#F7F4EC"/>
  <text class="t" x="36" y="42" font-size="22" font-weight="700">Medallion warehouse · Bronze → Silver → Gold</text>
  <text class="m" x="36" y="68" font-size="14">CRM + ERP CSVs into a star schema for analytics</text>
  <rect x="40" y="110" width="200" height="110" rx="14" fill="#B87333"/>
  <text class="b" x="100" y="155" font-size="20">Bronze</text>
  <text class="b" x="78" y="185" font-size="13" fill="#FFE8D4" font-weight="500">Raw source load</text>
  <polygon points="295,158 310,165 295,172" fill="#12352C"/>
  <line x1="240" y1="165" x2="295" y2="165" stroke="#12352C" stroke-width="3"/>
  <rect x="320" y="110" width="200" height="110" rx="14" fill="#8A9A9A"/>
  <text class="b" x="380" y="155" font-size="20">Silver</text>
  <text class="b" x="345" y="185" font-size="13" fill="#EEF2F2" font-weight="500">Clean + standardize</text>
  <polygon points="535,158 550,165 535,172" fill="#12352C"/>
  <line x1="520" y1="165" x2="535" y2="165" stroke="#12352C" stroke-width="3"/>
  <rect x="560" y="110" width="200" height="110" rx="14" fill="#C4A35A"/>
  <text class="b" x="630" y="155" font-size="20">Gold</text>
  <text class="b" x="590" y="185" font-size="13" fill="#FFF8E7" font-weight="500">Star schema facts</text>
  <polygon points="775,158 790,165 775,172" fill="#12352C"/>
  <line x1="760" y1="165" x2="775" y2="165" stroke="#12352C" stroke-width="3"/>
  <rect x="800" y="125" width="90" height="80" rx="12" fill="#1FA6A0"/>
  <text class="b" x="818" y="160" font-size="14">BI /</text>
  <text class="b" x="812" y="182" font-size="14">SQL</text>
</svg>
